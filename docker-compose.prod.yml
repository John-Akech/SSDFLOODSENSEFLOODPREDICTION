version: '3.8'

services:
  # PostgreSQL Database with PostGIS for geospatial support
  postgres:
    container_name: floodsense-postgres
    image: postgis/postgis:16-3.4  # PostgreSQL 16 with PostGIS extension
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodsense}
      POSTGRES_USER: ${POSTGRES_USER:-floodsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # SECURITY: PostgreSQL port NOT exposed to public internet
    # Database only accessible via Docker internal network
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"  # Commented out for security
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodsense_user} -d ${POSTGRES_DB:-floodsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100

  backend:
    container_name: floodsense-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-floodsense_user}:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/${POSTGRES_DB:-floodsense}?sslmode=require
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:80,http://127.0.0.1:3000,https://floodsense.org,https://www.floodsense.org}
    volumes:
      - ./backend/logs:/app/logs
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sar-detection:
    container_name: floodsense-sar
    build:
      context: ./ee-fastapi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GEE_PROJECT_ID=${GEE_PROJECT_ID:-floodsense-476422}
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gee-service-account.json
    volumes:
      - ${USERPROFILE}/.config/earthengine:/home/appuser/.config/earthengine:ro
      - ./ee-fastapi/output:/app/output
      - ./ee-fastapi/gee-service-account.json:/app/gee-service-account.json:ro
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    container_name: floodsense-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"  # HTTPS
    depends_on:
      - backend
      - sar-detection
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  floodsense-network:
    driver: bridge
    name: floodsense-network

volumes:
  postgres-data:
    driver: local
    name: floodsense-postgres-data

