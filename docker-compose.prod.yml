services:
  db:
    image: postgres:15-alpine
    container_name: floodsense-db
    environment:
      - POSTGRES_USER=floodsense_user
      - POSTGRES_PASSWORD=floodsense_password
      - POSTGRES_DB=floodsense_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodsense_user -d floodsense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: registry.digitalocean.com/floodsense-registry/floodsense-backend:${TAG:-latest}
    container_name: floodsense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://floodsense_user:floodsense_password@db:5432/floodsense_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80,http://frontend,http://frontend:80,http://${DROPLET_IP},http://${DROPLET_IP}:80,https://${DROPLET_IP}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=mailto:admin@floodsense.org
      - SAR_SERVICE_URL=http://sar-detection:8080
    volumes:
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      sar-detection:
        condition: service_started
    restart: unless-stopped
    networks:
      - floodsense-network

  sar-detection:
    build:
      context: ./ee-fastapi
      dockerfile: Dockerfile
    image: registry.digitalocean.com/floodsense-registry/floodsense-sar:${TAG:-latest}
    container_name: floodsense-sar
    ports:
      - "8080:8080"
    environment:
      - GEE_PROJECT_ID=ace-connection-474712-p1
      - GEE_SERVICE_ACCOUNT_KEY_BASE64=${GEE_SERVICE_ACCOUNT_KEY_BASE64}
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - DATABASE_URL=postgresql://floodsense_user:floodsense_password@db:5432/floodsense_db
    volumes:
      - sar-output:/app/output
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_SAR_URL=/sar
        - VITE_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    image: registry.digitalocean.com/floodsense-registry/floodsense-frontend:${TAG:-latest}
    container_name: floodsense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - sar-detection
    restart: unless-stopped
    networks:
      - floodsense-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: floodsense-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@floodsense.org
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - floodsense-network

networks:
  floodsense-network:
    driver: bridge
    name: floodsense-network

volumes:
  postgres-data:
  backend-logs:
  sar-output:
  pgadmin-data: