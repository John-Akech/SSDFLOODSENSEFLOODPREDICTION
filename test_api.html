<!DOCTYPE html>
<html>

<head>
    <title>FloodSense API Test</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0052a3;
        }

        pre {
            background: #0f0f1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .success {
            color: #00ff00;
        }

        .error {
            color: #ff0000;
        }
    </style>
</head>

<body>
    <h1>🧪 FloodSense API Tester</h1>
    <p>Tests API directly without browser cache issues</p>

    <button onclick="testBackend()">Test Backend Health</button>
    <button onclick="testAlerts()">Test Alerts</button>
    <button onclick="testPredictions()">Test Predictions</button>
    <button onclick="testSAR()">Test SAR Health</button>
    <button onclick="testAll()">Test All</button>

    <div id="results"></div>

    <script>
        const BASE_URL = 'https://floodsense-app-6a3uy.ondigitalocean.app';

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const color = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            results.innerHTML += `<div class="${color}">${message}</div>`;
        }

        function clear() {
            document.getElementById('results').innerHTML = '';
        }

        async function testBackend() {
            clear();
            log('<h2>Testing Backend Health</h2>');
            try {
                const response = await fetch(`${BASE_URL}/api/v1/health`);
                const data = await response.json();
                log(`✅ Status: ${response.status}`, 'success');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testAlerts() {
            clear();
            log('<h2>Testing Alerts Endpoint</h2>');
            try {
                const response = await fetch(`${BASE_URL}/api/v1/alerts?limit=5`);
                const data = await response.json();
                log(`✅ Status: ${response.status}`, 'success');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testPredictions() {
            clear();
            log('<h2>Testing Predictions Endpoint</h2>');
            try {
                const response = await fetch(`${BASE_URL}/api/v1/predictions?limit=5`);
                const data = await response.json();
                log(`✅ Status: ${response.status}`, 'success');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testSAR() {
            clear();
            log('<h2>Testing SAR Health</h2>');
            try {
                const response = await fetch(`${BASE_URL}/sar/health`);
                const data = await response.json();
                log(`✅ Status: ${response.status}`, 'success');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testAll() {
            clear();
            log('<h1>=== COMPLETE API TEST ===</h1>');
            await testBackend();
            await new Promise(r => setTimeout(r, 500));
            await testSAR();
            await new Promise(r => setTimeout(r, 500));
            await testAlerts();
            await new Promise(r => setTimeout(r, 500));
            await testPredictions();
            log('<h2>✅ All Tests Complete!</h2>', 'success');
        }
    </script>
</body>

</html>
