# PostgreSQL Configuration File
# Security and Performance Settings for FloodSense Production

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------
listen_addresses = '*'  # Listen on all interfaces (Docker internal)
max_connections = 100
superuser_reserved_connections = 3

# SSL
ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'
ssl_prefer_server_ciphers = on

# Password encryption
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------
# Only allow connections from specific IPs (handled by pg_hba.conf)
# Log all connection attempts
log_connections = on
log_disconnections = on
log_hostname = on

# Log security-related events
log_lock_waits = on
log_checkpoints = on
log_temp_files = 0  # Log all temporary file creations

#------------------------------------------------------------------------------
# QUERY PERFORMANCE AND MONITORING
#------------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 4MB
min_wal_size = 1GB
max_wal_size = 4GB

# Query performance monitoring
log_min_duration_statement = 1000  # Log queries taking > 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Enable pg_stat_statements for query analysis
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

#------------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
#------------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Log levels
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000

#------------------------------------------------------------------------------
# LOCALE AND FORMATTING
#------------------------------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

