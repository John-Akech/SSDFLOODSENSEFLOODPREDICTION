server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main SPA route
    location / {
        try_files $uri $uri/ /index.html;
        
        # HTTP/2 Server Push for critical resources
        http2_push_preload on;
    }

    # Disable caching for HTML files to ensure updates are seen immediately
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Link "</static/css/main.css>; rel=preload; as=style" always;
        expires 0;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Note: On DigitalOcean App Platform, routing is handled by the platform
    # The app.yaml/app-spec.yaml defines routes:
    #   /api/v1/* -> backend service
    #   /sar/* -> sar-detection service
    #   /* -> frontend service
    # This nginx config only serves static files for the frontend
    # API and SAR requests go through DigitalOcean's routing layer

    # Gzip compression - aggressive settings for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 9;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    gzip_disable "msie6";

    # Brotli compression (if module available)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;

    # Health check endpoint for load balancer
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
