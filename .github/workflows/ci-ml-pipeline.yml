name: ML Pipeline Refresh

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Optional note about why the pipeline was triggered manually"
        required: false

concurrency:
  group: ml-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-ml-pipeline:
    name: Execute ML pipeline scripts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
      GEE_PRIVATE_KEY: ${{ secrets.GEE_PRIVATE_KEY }}
      PIPELINE_RUN_NOTES: ${{ github.event.inputs.run_mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ML pipeline
        working-directory: backend/ml_pipeline
        shell: bash
        run: |
          set -o pipefail
          python run_pipeline.py 2>&1 | tee pipeline.log

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-artifacts
          path: |
            backend/ml_pipeline/pipeline.log
            backend/ml_pipeline/outputs
          if-no-files-found: warn
