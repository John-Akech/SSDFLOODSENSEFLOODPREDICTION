services:
  backend:
    container_name: floodsense-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./database/floodsense.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000,http://127.0.0.1:5173
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=mailto:admin@floodsense.org
      - SAR_SERVICE_URL=http://sar-detection:8080
    volumes:
      - ./backend/database:/app/database
      - ./backend/logs:/app/logs
      - ./models:/app/models:ro
    depends_on:
      - sar-detection
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sar-detection:
    container_name: floodsense-sar
    build:
      context: ./ee-fastapi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GEE_PROJECT_ID=ace-connection-474712-p1
      - API_HOST=0.0.0.0
      - API_PORT=8080
      # Note: Mount gee-service-account-key.json as volume or use GEE_SERVICE_ACCOUNT_KEY_BASE64
    volumes:
      - ./ee-fastapi/output:/app/output
      # Uncomment if you have service account key file:
      # - ./ee-fastapi/gee-service-account-key.json:/app/gee-service-account-key.json:ro
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    container_name: floodsense-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_VAPID_PUBLIC_KEY: BCfFpupgFjzlrtWzheHdS2eZeglftP82MOIzlQzjFfxnuxKr3TXbi29bdRaEmux1w6SUXH93ZRArDqyi1KYLy-U
        VITE_API_URL: /api/v1
        VITE_SAR_URL: /sar
    ports:
      - "80:80"
    depends_on:
      - backend
      - sar-detection
    restart: unless-stopped
    networks:
      - floodsense-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  floodsense-network:
    driver: bridge
    name: floodsense-network

volumes:
  backend-data:
  sar-output:
