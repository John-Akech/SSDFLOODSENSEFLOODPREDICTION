databases:
- engine: PG
  name: db
  version: "15"
ingress:
  rules:
  - component:
      name: backend
    match:
      path:
        prefix: /api/v1
  - component:
      name: sar-detection
    match:
      path:
        prefix: /sar
  - component:
      name: frontend
    match:
      path:
        prefix: /
name: floodsense
region: blr
services:
- dockerfile_path: backend/Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:xp0JB+jufG90QwO/ERKPS9ZzTgUNSoSv:ETw5yvA3Cc0M4DxSHetczQ==]
  - key: VAPID_PUBLIC_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:qMD3o4IumnqzRdjSDjZDztuBTw2BmS9I:J1e2kR6y76yv9mCSZRiSYg==]
  - key: VAPID_PRIVATE_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:ZXHhVTOPQppdo2IsXLH3OVNUn06Hvk3H:QFR05phZcxuJUmupgtP+ew==]
  - key: VAPID_SUBJECT
    scope: RUN_AND_BUILD_TIME
    value: mailto:admin@floodsense.org
  - key: SAR_SERVICE_URL
    scope: RUN_AND_BUILD_TIME
    value: http://sar-detection:8080
  - key: GEE_SERVICE_URL
    scope: RUN_AND_BUILD_TIME
    value: http://sar-detection:8080
  - key: API_PUBLIC_PATH
    scope: RUN_AND_BUILD_TIME
    value: /
  - key: ENVIRONMENT
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: CORS_ORIGINS
    scope: RUN_AND_BUILD_TIME
    value: https://floodsense-app-6a3uy.ondigitalocean.app,https://floodsense.org,http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost
  - key: ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: localhost,127.0.0.1,backend,floodsense-app-6a3uy.ondigitalocean.app,*.ondigitalocean.app,testserver
  github:
    branch: master
    deploy_on_push: true
    repo: John-Akech/SSDFLOODSENSEFLOODPREDICTION
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  name: backend
  source_dir: backend
  health_check:
    http_path: /health
    initial_delay_seconds: 60
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 3
- dockerfile_path: frontend/Dockerfile
  envs:
  - key: VITE_API_URL
    scope: BUILD_TIME
    value: /api/v1
  - key: VITE_SAR_URL
    scope: BUILD_TIME
    value: /sar
  - key: VITE_VAPID_PUBLIC_KEY
    scope: BUILD_TIME
    value: ${backend.VAPID_PUBLIC_KEY}
  github:
    branch: master
    deploy_on_push: true
    repo: John-Akech/SSDFLOODSENSEFLOODPREDICTION
  http_port: 80
  instance_count: 1
  instance_size_slug: basic-xxs
  name: frontend
  source_dir: frontend
- dockerfile_path: ee-fastapi/Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
  - key: GEE_PROJECT_ID
    scope: RUN_AND_BUILD_TIME
    value: ace-connection-474712-p1
  - key: SAR_PUBLIC_PATH
    scope: RUN_AND_BUILD_TIME
    value: /sar
  - key: PUBLIC_PATH
    scope: RUN_AND_BUILD_TIME
    value: /sar
  - key: GEE_SERVICE_ACCOUNT_KEY_BASE64
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: 
  github:
    branch: master
    deploy_on_push: true
    repo: John-Akech/SSDFLOODSENSEFLOODPREDICTION
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  name: sar-detection
  source_dir: ee-fastapi
  health_check:
    http_path: /health
    initial_delay_seconds: 60
    period_seconds: 30
    timeout_seconds: 15
    success_threshold: 1
    failure_threshold: 3
